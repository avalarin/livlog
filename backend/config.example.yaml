# Livlog Backend Configuration
#
# Environment variables can override these settings using the LIVLOG_ prefix.
# Example: LIVLOG_SERVER_PORT=9090 overrides server.port

server:
  host: "0.0.0.0"
  port: 8080
  # Public host used to construct MCP endpoint URLs.
  # Include port for local dev (uses http), omit port for production (uses https).
  public_host: "localhost:8080"

database:
  host: "localhost"
  port: 5432
  name: "livlog"
  user: "livlog"
  password: "livlog"
  sslmode: "disable"

logging:
  # Format: "json" for production (structured logging), "console" for development
  format: "console"

jwt:
  private_key_path: "./keys/private_key.pem"
  public_key_path: "./keys/public_key.pem"
  access_token_lifetime: 3600  # 1 hour in seconds
  refresh_token_lifetime: 2592000  # 30 days in seconds
  issuer: "livlog-api"
  audience: "livlog-app"

apple:
  bundle_id: "net.avalarin.groveapp"

openrouter:
  # OpenRouter API key for AI search
  # Get your API key from https://openrouter.ai
  api_key: "sk-"
  base_url: "https://openrouter.ai/api/v1/chat/completions"
  model: "perplexity/sonar"

email:
  # Enable real email sending via Resend.com
  # When disabled (default), verification code is always "000000" and no email is sent
  enabled: false
  # Resend.com API key — get yours at https://resend.com
  api_key: "re_"
  # Sender display name (e.g. "Grove")
  from_name: "Grove"
  # Sender address (must be verified in your Resend.com domain)
  from_address: "noreply@livlog.net"
  # Minimum time between verification code requests (per email/device/IP)
  resend_cooldown: "180s"
  # Maximum number of verification codes per email per hour
  max_codes_per_hour: 5
  # Enable IP-based rate limiting (disable for local dev behind shared NAT)
  ip_rate_limit_enabled: true

ratelimit:
  # AI search rate limits by policy
  ai_search_basic_limit: 5  # Number of AI searches for basic users
  ai_search_pro_limit: 50  # Number of AI searches for pro users
  ai_search_unlimited_limit: 0  # 0 means no limit for unlimited users
  ai_search_period: "24h"  # Period duration (e.g., "24h", "1h", "30m")
