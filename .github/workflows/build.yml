name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/build.yml'
    # Tag pushes ignore the paths filter (GitHub Actions behavior)
    tags:
      - 'v*'

jobs:
  build:
    name: Lint, Test, and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend

      - name: Run tests
        working-directory: backend
        run: go test -race ./...

      - name: Read version
        id: version
        working-directory: backend
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/avalarin/livlog
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit }},enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.ref_type == 'branch' && steps.version.outputs.commit || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
