name: Deploy Prod

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    # Triggers when Build completes on a tag push (workflow_run does not support tags filter directly,
    # so we filter by head_branch matching v* in the job condition below)

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    # Only run when the triggering workflow succeeded and was triggered by a tag push
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

